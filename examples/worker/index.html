<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'"
    />
    <title>CHMKit module Worker</title>
  </head>
  <body>
    <h1>CHMKit module Worker</h1>
    <p>
      Select a CHM. Parsing, reads and search execute in a dedicated module
      Worker.
    </p>
    <input id="archive" type="file" accept=".chm" aria-label="CHM archive" />
    <button id="dispose" type="button">Dispose Worker</button>
    <pre id="output" aria-live="polite">No archive selected.</pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
