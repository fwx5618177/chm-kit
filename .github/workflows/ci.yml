name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install independent CHM oracle on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
          7zz i
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run Vitest unit, integration and installed-package acceptance
        env:
          CHM_REQUIRE_7Z: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: pnpm test
      - name: Upload Node test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.os }}-${{ matrix.node }}
          path: test-results/vitest.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: ${{ matrix.browser }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright in a real browser
        run: pnpm test:browser --project=${{ matrix.browser }}
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-ubuntu
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 14
