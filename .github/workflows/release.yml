name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Decide the next version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve the next semantic version from conventional commits
        id: next
        run: node scripts/release.mjs next

  checks:
    name: Complete cross-platform and browser acceptance
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Bump, tag, release and publish to npm
    needs: [version, checks]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The npm trusted publisher names this environment, so the OIDC token must
    # carry it. It has no reviewers: publishing is unattended by design.
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - name: Bump the version and push the release commit
        run: node scripts/release.mjs prepare
      - name: Build and verify the consumer artifacts
        run: |
          pnpm build
          node scripts/package.mjs
      - name: Tag, create the GitHub release and publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs publish
          node scripts/release.mjs npm
