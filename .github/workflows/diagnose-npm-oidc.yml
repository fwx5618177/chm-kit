name: Diagnose npm OIDC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe trusted publishing exchange
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange an npm audience OIDC token for a publish token
        env:
          PACKAGE: chmkit
        run: |
          set -eu
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          node -e "const p=process.argv[1].split('.')[1];console.log(Buffer.from(p,'base64url').toString())" "$token" \
            | jq '{repository, workflow_ref, workflow, environment, ref, event_name}'
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/json' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PACKAGE")
          echo "exchange-status=$code"
          head -c 300 /tmp/exchange.json || true
          echo
          ls -a "$HOME/.npmrc" 2>/dev/null || echo "no user npmrc"
