name: Diagnose npm OIDC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe trusted publishing exchange
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request an npm audience OIDC token and inspect its claims
        env:
          PACKAGE: chmkit
        run: |
          set -eu
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is missing"
            exit 1
          fi
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "oidc-token-chars=${#token}"
          node -e "const p=process.argv[1].split('.')[1];console.log(Buffer.from(p,'base64url').toString())" "$token" \
            | jq '{aud, repository, repository_owner, workflow_ref, workflow, job_workflow_ref, environment, ref, event_name, sha}'
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/json' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PACKAGE")
          echo "exchange-status=$code"
          head -c 600 /tmp/exchange.json || true
